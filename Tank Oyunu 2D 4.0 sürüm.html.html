<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tank Wars 4.0</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body{
    overflow:hidden;
    background:#050805;
    color:white;
    font-family:Arial,sans-serif;
}

button{
    font-family:Arial,sans-serif;
}

.screen{
    position:fixed;
    inset:0;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.hidden{
    display:none !important;
}

/* =========================
   ANA MENÜ
========================= */

#menu{
    background:
        radial-gradient(
            circle at center,
            #294d31 0%,
            #111b14 45%,
            #050806 100%
        );
}

.logo{
    font-size:70px;
    font-weight:900;
    letter-spacing:8px;

    color:#6cff76;

    text-shadow:
        0 0 12px #3cff50,
        0 0 35px #168525;
}

.subtitle{
    color:#aebbb1;

    margin-top:10px;
    margin-bottom:35px;
}

.menuButton{
    width:280px;

    padding:17px;

    margin:7px;

    border:2px solid #5cff69;
    border-radius:9px;

    background:#0c160e;
    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    transition:.15s;
}

.menuButton:hover{
    background:#5cff69;
    color:#061006;

    transform:scale(1.04);
}

.currency{
    position:absolute;

    top:20px;
    right:25px;

    display:flex;
    gap:20px;

    font-size:18px;
}

.coin{
    color:#ffd43b;
}

.gem{
    color:#55ddff;
}

/* =========================
   PANEL
========================= */

.panelScreen{
    background:
        radial-gradient(
            circle,
            #1b3424,
            #0a120d 65%,
            #040705
        );
}

.panel{
    width:950px;
    max-width:94%;
    max-height:90vh;

    overflow:auto;

    background:#101a13;

    border:2px solid #4fe65b;
    border-radius:16px;

    padding:28px;

    box-shadow:
        0 0 35px #000;
}

.panel h2{
    text-align:center;

    color:#68ff73;

    font-size:32px;

    margin-bottom:22px;
}

.cards{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;
}

.card{
    background:#18261c;

    border:2px solid #314b36;

    border-radius:10px;

    padding:18px;

    text-align:center;

    cursor:pointer;

    transition:.15s;
}

.card:hover{
    border-color:#63ff6e;

    transform:
        translateY(-3px);
}

.card.selected{
    border-color:#69ff72;

    box-shadow:
        0 0 15px #3cff5044;
}

.card.locked{
    opacity:.45;

    cursor:not-allowed;
}

.cardIcon{
    font-size:50px;

    margin-bottom:10px;
}

.card h3{
    margin-bottom:7px;
}

.card p{
    color:#aab7ad;

    font-size:14px;

    line-height:1.5;
}

.actionButton{
    display:block;

    margin:25px auto 0;

    padding:15px 50px;

    border:0;
    border-radius:8px;

    background:#5cff69;

    color:#061006;

    font-size:19px;
    font-weight:bold;

    cursor:pointer;
}

.backButton{
    display:block;

    margin:10px auto 0;

    padding:11px 40px;

    border:1px solid #59665c;

    border-radius:7px;

    background:#29352d;

    color:white;

    cursor:pointer;
}

/* =========================
   OYUN
========================= */

#game{
    display:none;

    position:fixed;
    inset:0;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;

    top:15px;
    left:15px;

    width:300px;

    z-index:5;

    pointer-events:none;
}

.hudBox{
    background:
        rgba(0,0,0,.65);

    border:
        1px solid #ffffff1c;

    border-radius:9px;

    padding:10px;

    margin-bottom:8px;
}

.bar{
    height:14px;

    width:100%;

    background:#252c28;

    border-radius:20px;

    overflow:hidden;

    margin-top:5px;
}

#hpBar{
    height:100%;
    width:100%;

    background:
        linear-gradient(
            90deg,
            #ff2929,
            #ff9900
        );
}

#xpBar{
    height:100%;
    width:0%;

    background:
        linear-gradient(
            90deg,
            #20aaff,
            #9effff
        );
}

#waveLabel{
    color:#ffd84d;

    font-size:23px;

    font-weight:bold;
}

#coinLabel{
    color:#ffd43b;
}

#weaponLabel{
    color:#70ff82;

    font-weight:bold;
}

/* =========================
   SİLAH HUD
========================= */

#weaponHelp{
    color:#aaa;

    font-size:12px;

    margin-top:4px;
}

/* =========================
   BOSS
========================= */

#bossUI{
    display:none;

    position:fixed;

    top:15px;
    left:50%;

    transform:
        translateX(-50%);

    width:430px;

    z-index:7;

    text-align:center;
}

#bossName{
    color:#ff4545;

    font-size:21px;

    font-weight:bold;

    margin-bottom:5px;

    text-shadow:
        0 0 12px red;
}

#bossBar{
    width:100%;

    height:18px;

    border:
        2px solid #ff3636;

    border-radius:20px;

    background:#351010;

    overflow:hidden;
}

#bossHP{
    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff1010,
            #ff9500
        );
}

/* =========================
   WAVE
========================= */

#waveAnnouncement{
    display:none;

    position:fixed;

    z-index:10;

    left:50%;
    top:43%;

    transform:
        translate(-50%,-50%);

    color:white;

    font-size:62px;

    font-weight:900;

    text-shadow:
        0 0 20px #ffc400;

    pointer-events:none;
}

/* =========================
   SHOP
========================= */

#shop{
    display:none;

    background:
        rgba(3,7,4,.97);
}

.shopItem{
    display:flex;

    justify-content:space-between;
    align-items:center;

    padding:15px;

    background:#19271c;

    border-radius:8px;

    margin:10px 0;
}

.shopItem button{
    background:#5cff69;

    border:0;

    padding:10px 16px;

    border-radius:6px;

    font-weight:bold;

    cursor:pointer;
}

.shopTitle{
    color:#68ff73;

    margin:
        20px 0 10px;
}

/* =========================
   GAME OVER
========================= */

#gameOver{
    display:none;

    background:
        rgba(0,0,0,.92);
}

#gameOver h2{
    color:#ff4141;

    font-size:65px;

    text-shadow:
        0 0 25px red;
}

#gameOver p{
    margin-top:8px;

    color:#ccc;
}

/* =========================
   MOBİL
========================= */

@media(max-width:700px){

    .logo{
        font-size:42px;
    }

    .cards{
        grid-template-columns:
            repeat(2,1fr);
    }

    .panel{
        padding:15px;
    }

    #bossUI{
        width:70%;
    }

    #waveAnnouncement{
        font-size:42px;
    }

}

</style>
</head>

<body>
<!-- ================================
     ANA MENÜ
================================ -->

<div id="menu" class="screen">

    <div class="currency">

        <span class="coin">
            🪙 <span id="menuCoins">0</span>
        </span>

        <span class="gem">
            💎 <span id="menuGems">0</span>
        </span>

    </div>

    <div class="logo">
        TANK WARS
    </div>

    <div class="subtitle">
        CANAVAR İSTİLASINA KARŞI SAVAŞ
    </div>

    <button
        class="menuButton"
        onclick="openTankSelect()">

        ▶ OYNA

    </button>

    <button
        class="menuButton"
        onclick="openShop()">

        🏪 MAĞAZA

    </button>

</div>


<!-- ================================
     TANK SEÇİMİ
================================ -->

<div
    id="tankScreen"
    class="screen panelScreen hidden">

    <div class="panel">

        <h2>
            🚜 TANKINI SEÇ
        </h2>

        <div
            id="tankCards"
            class="cards">
        </div>

        <button
            class="actionButton"
            onclick="openMapSelect()">

            DEVAM ET →

        </button>

        <button
            class="backButton"
            onclick="backToMenu()">

            ← GERİ

        </button>

    </div>

</div>


<!-- ================================
     HARİTA SEÇİMİ
================================ -->

<div
    id="mapScreen"
    class="screen panelScreen hidden">

    <div class="panel">

        <h2>
            🗺️ HARİTA SEÇ
        </h2>

        <div
            id="mapCards"
            class="cards">
        </div>

        <button
            class="actionButton"
            onclick="startSelectedGame()">

            ⚔️ SAVAŞA BAŞLA

        </button>

        <button
            class="backButton"
            onclick="openTankSelect()">

            ← GERİ

        </button>

    </div>

</div>


<!-- ================================
     OYUN
================================ -->

<div id="game">

    <canvas id="canvas"></canvas>


    <!-- HUD -->

    <div id="hud">

        <div class="hudBox">

            ❤️ CAN

            <div class="bar">

                <div id="hpBar"></div>

            </div>

        </div>


        <div class="hudBox">

            ⭐ LEVEL

            <span id="levelLabel">
                1
            </span>

            <div class="bar">

                <div id="xpBar"></div>

            </div>

        </div>


        <div class="hudBox">

            <div id="waveLabel">
                WAVE 1
            </div>

            <div id="coinLabel">
                🪙 0
            </div>

            <div id="weaponLabel">
                🔫 Cannon
            </div>

            <div id="weaponHelp">
                1-5: Silah Değiştir
            </div>

        </div>

    </div>


    <!-- BOSS -->

    <div id="bossUI">

        <div id="bossName">
            ☠️ BOSS
        </div>

        <div id="bossBar">

            <div id="bossHP"></div>

        </div>

    </div>


    <!-- WAVE YAZISI -->

    <div id="waveAnnouncement">
        WAVE 1
    </div>

</div>


<!-- ================================
     MAĞAZA
================================ -->

<div id="shop" class="screen">

    <div class="panel">

        <h2>
            🏪 MAĞAZA
        </h2>


        <!-- SİLAHLAR -->

        <h3 class="shopTitle">
            🔫 SİLAHLAR
        </h3>

        <div id="weaponShop"></div>


        <!-- GELİŞTİRMELER -->

        <h3 class="shopTitle">
            ⚙️ GELİŞTİRMELER
        </h3>


        <div class="shopItem">

            <div>

                🔥 Top Hasarı

                <br>

                Seviye:

                <span id="damageLevel">
                    1
                </span>

            </div>

            <button
                onclick="buyDamage()">

                YÜKSELT

                🪙

                <span id="damagePrice">
                    100
                </span>

            </button>

        </div>


        <div class="shopItem">

            <div>

                ❤️ Maksimum Can

                <br>

                Seviye:

                <span id="healthLevel">
                    1
                </span>

            </div>

            <button
                onclick="buyHealth()">

                YÜKSELT

                🪙

                <span id="healthPrice">
                    150
                </span>

            </button>

        </div>


        <div class="shopItem">

            <div>

                ⚡ Ateş Hızı

                <br>

                Seviye:

                <span id="fireLevel">
                    1
                </span>

            </div>

            <button
                onclick="buyFireRate()">

                YÜKSELT

                🪙

                <span id="firePrice">
                    200
                </span>

            </button>

        </div>


        <button
            class="backButton"
            onclick="closeShop()">

            KAPAT

        </button>

    </div>

</div>


<!-- ================================
     GAME OVER
================================ -->

<div
    id="gameOver"
    class="screen">

    <h2>
        GAME OVER
    </h2>

    <p id="finalWave"></p>

    <p id="finalLevel"></p>

    <p id="finalCoins"></p>


    <button
        class="actionButton"
        onclick="restartGame()">

        🔄 TEKRAR OYNA

    </button>


    <button
        class="backButton"
        onclick="backToMenu()">

        🏠 ANA MENÜ

    </button>

<script>

/* =====================================================
   TANK WARS 4.0
   OYUN MOTORU
===================================================== */


/* =====================================================
   KAYIT SİSTEMİ
===================================================== */

const SAVE_KEY = "tankWarsSave_v4";

let saveData = {

    coins: 1000,
    gems: 0,

    level: 1,

    selectedTank: "scout",
    selectedMap: "desert",

    unlockedTanks: [
        "scout"
    ],

    unlockedMaps: [
        "desert"
    ],

    damageUpgrade: 1,
    healthUpgrade: 1,
    fireUpgrade: 1,

    ownedWeapons: [
        "cannon"
    ],

    selectedWeapon: "cannon"

};


function loadSave(){

    const saved =
        localStorage.getItem(SAVE_KEY);

    if(saved){

        try{

            saveData =
                Object.assign(
                    saveData,
                    JSON.parse(saved)
                );

        }
        catch(error){

            console.log(
                "Kayıt okunamadı."
            );

        }

    }

}


function saveGame(){

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(saveData)
    );

}


loadSave();


/* =====================================================
   TANKLAR
===================================================== */

const tanks = {

    scout:{

        name:"Scout",
        icon:"🚜",

        description:
            "Hızlı ve çevik tank.",

        hp:120,
        speed:5.2,
        damage:20

    },

    assault:{

        name:"Assault",
        icon:"🛡️",

        description:
            "Dengeli savaş tankı.",

        hp:180,
        speed:4,
        damage:28

    },

    heavy:{

        name:"Heavy",
        icon:"💥",

        description:
            "Çok dayanıklı fakat yavaş.",

        hp:300,
        speed:2.7,
        damage:40

    },

    plasma:{

        name:"Plasma",
        icon:"⚡",

        description:
            "Gelişmiş enerji tankı.",

        hp:220,
        speed:4.3,
        damage:55

    },

    titan:{

        name:"Titan",
        icon:"🤖",

        description:
            "Efsanevi ağır tank.",

        hp:450,
        speed:2.3,
        damage:75

    }

};


/* =====================================================
   HARİTALAR
===================================================== */

const maps = {

    desert:{

        name:"Çöl",
        icon:"🏜️",

        description:
            "Sıcak ve geniş savaş alanı.",

        requiredLevel:1,

        background:"#26301c"

    },

    forest:{

        name:"Orman",
        icon:"🌲",

        description:
            "Sık ağaçların bulunduğu tehlikeli bölge.",

        requiredLevel:3,

        background:"#10281a"

    },

    ice:{

        name:"Buz Gezegeni",
        icon:"❄️",

        description:
            "Soğuk ve tehlikeli savaş alanı.",

        requiredLevel:6,

        background:"#102533"

    },

    lava:{

        name:"Lav Bölgesi",
        icon:"🌋",

        description:
            "Lavlarla çevrili ölümcül arena.",

        requiredLevel:10,

        background:"#301512"

    },

    space:{

        name:"Uzay Üssü",
        icon:"🚀",

        description:
            "Düşmanların ana üssü.",

        requiredLevel:15,

        background:"#0d102b"

    }

};


/* =====================================================
   SİLAHLAR
===================================================== */

const weapons = {

    cannon:{

        name:"Cannon",
        icon:"🔫",

        price:0,

        damage:25,

        fireDelay:280,

        bulletSpeed:11,

        bulletSize:5,

        color:"#ffe45c"

    },

    machinegun:{

        name:"Machine Gun",
        icon:"🔫",

        price:500,

        damage:12,

        fireDelay:90,

        bulletSpeed:14,

        bulletSize:4,

        color:"#ffcf4a"

    },

    shotgun:{

        name:"Shotgun",
        icon:"💥",

        price:900,

        damage:18,

        fireDelay:500,

        bulletSpeed:10,

        bulletSize:5,

        color:"#ff8c42"

    },

    rocket:{

        name:"Rocket Launcher",
        icon:"🚀",

        price:1500,

        damage:85,

        fireDelay:700,

        bulletSpeed:8,

        bulletSize:8,

        color:"#ff4444"

    },

    laser:{

        name:"Laser",
        icon:"⚡",

        price:2500,

        damage:35,

        fireDelay:120,

        bulletSpeed:20,

        bulletSize:3,

        color:"#55ffff"

    }

};


let ownedWeapons =
    saveData.ownedWeapons || [
        "cannon"
    ];


let selectedWeapon =
    saveData.selectedWeapon ||
    "cannon";


function getWeapon(){

    return weapons[
        selectedWeapon
    ];

}


/* =====================================================
   TANK SEÇİMİ
===================================================== */

let selectedTank =
    saveData.selectedTank ||
    "scout";


let selectedMap =
    saveData.selectedMap ||
    "desert";


function openTankSelect(){

    hideAllScreens();

    document
        .getElementById("tankScreen")
        .classList
        .remove("hidden");

    renderTanks();

}


function renderTanks(){

    const container =
        document.getElementById(
            "tankCards"
        );

    container.innerHTML = "";

    for(const id in tanks){

        const tank =
            tanks[id];

        const unlocked =
            saveData.unlockedTanks
            .includes(id);

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "card";

        if(!unlocked)
            card.classList.add(
                "locked"
            );

        if(
            selectedTank === id
        )
            card.classList.add(
                "selected"
            );

        card.innerHTML = `

            <div class="cardIcon">
                ${tank.icon}
            </div>

            <h3>
                ${tank.name}
            </h3>

            <p>
                ${tank.description}
            </p>

            <p>

                ❤️ ${tank.hp}

                <br>

                ⚡ Hız: ${tank.speed}

                <br>

                💥 Hasar: ${tank.damage}

            </p>

            <br>

            ${
                unlocked
                ?
                "✅ AÇIK"
                :
                "🔒 KİLİTLİ"
            }

        `;


        if(unlocked){

            card.onclick = ()=>{

                selectedTank = id;

                renderTanks();

            };

        }


        container.appendChild(
            card
        );

    }

}


/* =====================================================
   HARİTA
===================================================== */

function openMapSelect(){

    hideAllScreens();

    document
        .getElementById("mapScreen")
        .classList
        .remove("hidden");

    renderMaps();

}


function renderMaps(){

    const container =
        document.getElementById(
            "mapCards"
        );

    container.innerHTML = "";


    for(const id in maps){

        const map =
            maps[id];

        const unlocked =
            saveData.unlockedMaps
            .includes(id)
            ||
            saveData.level >=
            map.requiredLevel;


        const card =
            document.createElement(
                "div"
            );

        card.className =
            "card";


        if(!unlocked)
            card.classList.add(
                "locked"
            );


        if(selectedMap === id)
            card.classList.add(
                "selected"
            );


        card.innerHTML = `

            <div class="cardIcon">
                ${map.icon}
            </div>

            <h3>
                ${map.name}
            </h3>

            <p>
                ${map.description}
            </p>

            <br>

            ${
                unlocked
                ?
                "✅ AÇIK"
                :
                "🔒 Level " +
                map.requiredLevel
            }

        `;


        if(unlocked){

            card.onclick = ()=>{

                selectedMap = id;

                renderMaps();

            };

        }


        container.appendChild(
            card
        );

    }

}


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext("2d");


function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   OYUNCU
===================================================== */

let player;


function createPlayer(){

    const tank =
        tanks[selectedTank];


    const damage =
        tank.damage +
        (
            saveData.damageUpgrade - 1
        ) * 8;


    const maxHP =
        tank.hp +
        (
            saveData.healthUpgrade - 1
        ) * 25;


    return{

        x:
            canvas.width / 2,

        y:
            canvas.height / 2,

        radius:24,

        angle:0,

        speed:tank.speed,

        maxHP:maxHP,

        hp:maxHP,

        damage:damage,

        fireDelay:70,

        lastShot:0,

        level:
            saveData.level,

        xp:0,

        coins:
            saveData.coins

    };

}


/* =====================================================
   OYUN DEĞİŞKENLERİ
===================================================== */

let enemies = [];

let bullets = [];

let enemyBullets = [];

let particles = [];

let obstacles = [];

let laserEffects = [];

let wave = 1;

let spawnLeft = 0;

let spawnTimer = 0;

let running = false;

let keys = {};

let mouse = {

    x:0,
    y:0,
    down:false

};


/* =====================================================
   INPUT
===================================================== */

window.addEventListener(
    "keydown",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = true;


        if(e.key === "1")
            selectWeapon(
                "cannon"
            );

        if(e.key === "2")
            selectWeapon(
                "machinegun"
            );

        if(e.key === "3")
            selectWeapon(
                "shotgun"
            );

        if(e.key === "4")
            selectWeapon(
                "rocket"
            );

        if(e.key === "5")
            selectWeapon(
                "laser"
            );

    }
);


window.addEventListener(
    "keyup",
    function(e){

        keys[

/* =====================================================
   ÇARPIŞMA
===================================================== */

function circleRect(c,r){

    const cx =
        Math.max(
            r.x,
            Math.min(
                c.x,
                r.x+r.w
            )
        );


    const cy =
        Math.max(
            r.y,
            Math.min(
                c.y,
                r.y+r.h
            )
        );


    const dx =
        c.x-cx;

    const dy =
        c.y-cy;


    return(
        dx*dx+
        dy*dy
        <
        c.radius*c.radius
    );

}

/* =====================================================
   OYUNCU ATEŞİ
===================================================== */

function shoot(){

    const now =
        Date.now();


    const weapon =
        getWeapon();


    if(

        now-player.lastShot
        <
        Math.max(
            45,
            weapon.fireDelay -
            (
                saveData.fireUpgrade-1
            )*15
        )

    )
        return;


    player.lastShot =
        now;


    const angle =
        player.angle;


    /* SHOTGUN */

    if(
        selectedWeapon ===
        "shotgun"
    ){

        for(
            let i=-2;
            i<=2;
            i++
        ){

            const spread =
                angle +
                i*.12;


            bullets.push({

                x:
                    player.x+
                    Math.cos(spread)*30,

                y:
                    player.y+
                    Math.sin(spread)*30,

                vx:
                    Math.cos(spread)*
                    weapon.bulletSpeed,

                vy:
                    Math.sin(spread)*
                    weapon.bulletSpeed,

                radius:
                    weapon.bulletSize,

                damage:
                    weapon.damage+
                    (
                        saveData.damageUpgrade-1
                    )*5,

                color:
                    weapon.color,

                rocket:false

            });

        }

        return;

    }


    /* LAZER */

    if(
        selectedWeapon ===
        "laser"
    ){

        laserEffects.push({

            x:player.x,
            y:player.y,

            angle:angle,

            life:8,

            damage:
                weapon.damage+
                (
                    saveData.damageUpgrade-1
                )*5

        });


        for(
            const enemy of enemies
        ){

            const dx =
                enemy.x-player.x;

            const dy =
                enemy.y-player.y;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            if(distance > 700)
                continue;


            const enemyAngle =
                Math.atan2(
                    dy,
                    dx
                );


            let difference =
                Math.abs(
                    angle-
                    enemyAngle
                );


            if(difference > Math.PI)
                difference =
                    Math.PI*2-
                    difference;


            if(
                difference < .08
            ){

                enemy.hp -=
                    laserEffects[
                        laserEffects.length-1
                    ].damage;

            }

        }

        return;

    }


    /* NORMAL MERMİ */

    bullets.push({

        x:
            player.x+
            Math.cos(angle)*30,

        y:
            player.y+
            Math.sin(angle)*30,

        vx:
            Math.cos(angle)*
            weapon.bulletSpeed,

        vy:
            Math.sin(angle)*
            weapon.bulletSpeed,

        radius:
            weapon.bulletSize,

        damage:
            weapon.damage+
            (
                saveData.damageUpgrade-1
            )*5,

        color:
            weapon.color,

        rocket:
            selectedWeapon ===
            "rocket"

    });

}

                );

/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(!running)
        return;


    /* =========================
       HAREKET
    ========================= */

    let dx = 0;
    let dy = 0;


    if(
        keys["w"] ||
        keys["arrowup"]
    )
        dy--;


    if(
        keys["s"] ||
        keys["arrowdown"]
    )
        dy++;


    if(
        keys["a"] ||
        keys["arrowleft"]
    )
        dx--;


    if(
        keys["d"] ||
        keys["arrowright"]
    )
        dx++;


    if(dx || dy){

        const len =
            Math.hypot(
                dx,
                dy
            );


        dx /= len;
        dy /= len;


        const oldX =
            player.x;

        const oldY =
            player.y;


        player.x +=
            dx*
            player.speed;


        player.y +=
            dy*
            player.speed;


        for(
            const obstacle
            of obstacles
        ){

            if(
                circleRect(
                    player,
                    obstacle
                )
            ){

                player.x =
                    oldX;

                player.y =
                    oldY;

            }

        }

    }


    player.x =
        Math.max(
            25,
            Math.min(
                canvas.width-25,
                player.x
            )
        );


    player.y =
        Math.max(
            25,
            Math.min(
                canvas.height-25,
                player.y
            )
        );


    /* =========================
       NİŞAN
    ========================= */

    player.angle =
        Math.atan2(
            mouse.y-player.y,
            mouse.x-player.x
        );


    if(mouse.down)
        shoot();


    /* =========================
       DÜŞMAN SPAWN
    ========================= */

    if(spawnLeft > 0){

        spawnTimer--;


        if(spawnTimer <= 0){

            spawnEnemy();

            spawnLeft--;

            spawnTimer =
                Math.max(
                    15,
                    35-wave
                );

        }

    }


    /* =========================
       MERMİLER
    ========================= */

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            bullets[i];


        bullet.x +=
            bullet.vx;

        bullet.y +=
            bullet.vy;


        let blocked =
            false;


        for(
            const obstacle
            of obstacles
        ){

            if(

                bullet.x >
                obstacle.x &&

                bullet.x <
                obstacle.x+
                obstacle.w &&

                bullet.y >
                obstacle.y &&

                bullet.y <
                obstacle.y+
                obstacle.h

            ){

                blocked = true;

                explosion(
                    bullet.x,
                    bullet.y,
                    "#ffffff"
                );

                break;

            }

        }


        if(blocked){

            bullets.splice(
                i,
                1
            );

            continue;

        }


        if(

            bullet.x < -40 ||
            bullet.x >
                canvas.width+40 ||
            bullet.y < -40 ||
            bullet.y >
                canvas.height+40

        ){

            bullets.splice(
                i,
                1
            );

            continue;

        }


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const enemy =
                enemies[j];


            const distance =
                Math.hypot(
                    bullet.x-enemy.x,
                    bullet.y-enemy.y
                );


            if(

                distance <
                bullet.radius+
                enemy.radius

            ){

                enemy.hp -=
                    bullet.damage;


                if(
                    bullet.rocket
                ){

                    rocketExplosion(
                        bullet.x,
                        bullet.y,
                        bullet.damage
                    );

                }
                else{

                    explosion(
                        bullet.x,
                        bullet.y,
                        bullet.color ||
                        "#ffffff"
                    );

                }


                bullets.splice(
                    i,
                    1
                );


                if(
                    enemy.hp <= 0
                ){

                    killEnemy(
                        enemy,
                        j
                    );

                }


                break;

            }

        }

    }


    /* =========================
       LAZER EFEKTLERİ
    ========================= */

    for(
        let i=
            laserEffects.length-1;
        i>=0;
        i--
    ){

        laserEffects[i].life--;


        if(
            laserEffects[i].life <= 0
        ){

            laserEffects.splice(
                i,
                1
            );

        }

    }


    /* =========================
       DÜŞMANLAR
    ========================= */

    for(
        const enemy of enemies
    ){

        const angle =
            Math.atan2(
                player.y-enemy.y,
                player.x-enemy.x
            );


        const distance =
            Math.hypot(
                player.x-enemy.x,
                player.y-enemy.y
            );


        /* ATIŞ */

        if(

            enemy.type ===
            "shooter" ||

            enemy.type ===
            "boss"

        ){

            enemy.shoot--;


            if(
                enemy.shoot <= 0
            ){

                enemyShoot(
                    enemy
                );


                enemy.shoot =
                    enemy.type === "boss"
                    ? 70
                    : 130;

            }

        }


        /* BOSS */

        if(
            enemy.type ===
            "boss"
        ){

            enemy.special--;


            if(
                enemy.special <= 0
            ){

                bossSpecial(
                    enemy
                );


                enemy.special =
                    280;

            }

        }


        /* HAREKET */

        if(

            enemy.type !==
            "shooter" ||

            distance > 300

        ){

            enemy.x +=
                Math.cos(angle)*
                enemy.speed;

            enemy.y +=
                Math.sin(angle)*
                enemy.speed;

        }


        /* ÇARPMA */

        if(

            distance <
            player.radius+
            enemy.radius

        ){

            player.hp -=
                enemy.damage*.025;

        }

    }


    /* =========================
       DÜŞMAN MERMİLERİ
    ========================= */

    for(
        let i=
            enemyBullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            enemyBullets[i];


        bullet.x +=
            bullet.vx;

        bullet.y +=
            bullet.vy;


        let blocked =
            false;


        for(
            const obstacle
            of obstacles
        ){

            if(

                bullet.x >
                obstacle.x &&

                bullet.x <
                obstacle.x+
                obstacle.w &&

                bullet.y >
                obstacle.y &&

                bullet.y <
                obstacle.y+
                obstacle.h

            ){

                blocked = true;

                break;

            }

        }


        if(blocked){

            enemyBullets.splice(
                i,
                1
            );

            continue;

        }


        const distance =
            Math.hypot(
                bullet.x-player.x,
                bullet.y-player.y
            );


        if(

            distance <
            player.radius+
            bullet.radius

        ){

            player.hp -=
                bullet.damage;


            explosion(
                bullet.x,
                bullet.y,
                "#ff3333"
            );


            enemyBullets.splice(
                i,
                1
            );

        }

    }


    /* =========================
       PARTICLES
    ========================= */

    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const particle =
            particles[i];


        particle.x +=
            particle.vx;

        particle.y +=
            particle.vy;

        particle.life--;


        if(
            particle.life <= 0
        ){

            particles.splice(
                i,
                1
            );

        }

    }


    /* =========================
       BOSS BAR
    ========================= */

    const boss =
        enemies.find(
            enemy =>
                enemy.type ===
                "boss"
        );


    if(boss){

        document
            .getElementById(
                "bossUI"
            )
            .style.display =
            "block";


        document
            .getElementById(
                "bossHP"
            )
            .style.width =

            Math.max(
                0,
                boss.hp/
                boss.maxHP*
                100
            )+"%";

    }
    else{

        document
            .getElementById(
                "bossUI"
            )
            .style.display =
            "none";

    }


    /* =========================
       WAVE
    ========================= */

    if(

        spawnLeft <= 0 &&
        enemies.length === 0

    ){

        wave++;


        if(
            wave % 5 === 0
        ){

            spawnBoss();

        }
        else{

            startWave();

        }

    }


    /* =========================
       GAME OVER
    ========================= */

    if(
        player.hp <= 0
    ){

        endGame();

    }


    updateHUD();

}


/* =====================================================
   DÜŞMAN ÖLDÜR
===================================================== */

function killEnemy(
    enemy,
    index
){

    if(
        enemy.type ===
        "exploder"
    ){

        const distance =
            Math.hypot(
                player.x-enemy.x,
                player.y-enemy.y
            );


        if(
            distance < 150
        ){

            player.hp -=
                35;

        }


        rocketExplosion(
            enemy.x,
            enemy.y,
            35
        );

    }


    player.coins +=
        enemy.coins;


    gainXP(
        enemy.xp
    );


    explosion(
        enemy.x,
        enemy.y,
        enemy.color
    );


    if(
        enemy.type ===
        "boss"
    ){

        player.coins +=
            1000;


        announce(
            "🏆 BOSS YENİLDİ!"
        );

    }


    enemies.splice(
        index,
        1
    );

}


/* =====================================================
   XP
===================================================== */

function gainXP(amount){

    player.xp +=
        amount;


    const need =
        player.level *
        120;


    if(
        player.xp >= need
    ){

        player.xp -=
            need;


        player.level++;


        player.maxHP +=
            15;


        player.hp =
            player.maxHP;


        player.damage +=
            4;


        saveData.level =
            Math.max(
                saveData.level,
                player.level
            );


        unlockProgress();


        saveGame();


        announce(
            "⭐ LEVEL UP!"
        );

    }

}


/* =====================================================
   LEVEL ÖDÜLLERİ
===================================================== */

function unlockProgress(){

    if(
        saveData.level >= 3 &&
        !saveData.unlockedMaps
            .includes("forest")
    ){

        saveData.unlockedMaps

            .push("ice");

    }


    if(
        saveData.level >= 10 &&
        !saveData.unlockedMaps
            .includes("lava")
    ){

        saveData.unlockedMaps
            .push("lava");

    }


    if(
        saveData.level >= 15 &&
        !saveData.unlockedMaps
            .includes("space")
    ){

        saveData.unlockedMaps
            .push("space");

    }


    if(
        saveData.level >= 4 &&
        !saveData.unlockedTanks
            .includes("assault")
    ){

        saveData.unlockedTanks
            .push("assault");

    }


    if(
        saveData.level >= 8 &&
        !saveData.unlockedTanks
            .includes("heavy")
    ){

        saveData.unlockedTanks
            .push("heavy");

    }


    if(
        saveData.level >= 12 &&
        !saveData.unlockedTanks
            .includes("plasma")
    ){

        saveData.unlockedTanks
            .push("plasma");

    if(
        saveData.level >= 20 &&
        !saveData.unlockedTanks
            .includes("titan")
    ){

        saveData.unlockedTanks
            .push("titan");

    }

}


/* =====================================================
   HUD
===================================================== */

        return;


    document
        .getElementById(
            "hpBar"
        )
        .style.width =

        Math.max(
            0,
            player.hp/
            player.maxHP*
            100
        )+"%";


    document
        .getElementById(
            "xpBar"
        )
        .style.width =

/* =====================================================
   ÇİZİM
===================================================== */

function draw(){

    const map =
        maps[selectedMap];


    /* ARKA PLAN */

    ctx.fillStyle =
        map.background;


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* IZGARA */

    ctx.strokeStyle =
        "rgba(255,255,255,.035)";


    for(
        let x=0;
        x<canvas.width;
        x+=50
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<canvas.height;
        y+=50
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();

    }


    /* ENGELLER */

    for(
        const obstacle
        of obstacles
    ){

        ctx.fillStyle =
            "#39483d";


        ctx.fillRect(
            obstacle.x,
            obstacle.y,
            obstacle.w,
            obstacle.h
        );


        ctx.strokeStyle =
            "#778579";


        ctx.strokeRect(
            obstacle.x,
            obstacle.y,
            obstacle.w,
            obstacle.h
        );

    }


    /* MERMİLER */

    for(
        const bullet
        of bullets
    ){

        ctx.fillStyle =
            bullet.color ||
            "#ffe45c";


        ctx.beginPath();


        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.radius,
            0,
            Math.PI*2
        );


        ctx.fill();

    }


    /* DÜŞMAN MERMİLERİ */

    for(
        const bullet
        of enemyBullets
    ){

        ctx.fillStyle =
            "#ff5555";


        ctx.beginPath();


        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.radius,
            0,
            Math.PI*2
        );


        ctx.fill();

    }


    /* LAZER */

    for(
        const laser
        of laserEffects
    ){

        ctx.save();


        ctx.translate(
            laser.x,
            laser.y
        );


        ctx.rotate(
            laser.angle
        );


        ctx.globalAlpha =
            laser.life/8;


        ctx.shadowBlur = 20;

        ctx.shadowColor =
            "#55ffff";


        ctx.fillStyle =
            "#55ffff";


        ctx.fillRect(
            0,
            -4,
            750,
            8
        );


        ctx.fillStyle =
            "#ffffff";


        ctx.fillRect(
            0,
            -1,
            750,
            2
        );


        ctx.restore();

        ctx.globalAlpha = 1;

    }


    /* DÜŞMANLAR */

    for(
        const enemy
        of enemies
    ){

        ctx.save();


        ctx.translate(
            enemy.x,
            enemy.y
        );


        /* CAN BAR */

        ctx.fillStyle =
            "#111";


        ctx.fillRect(
            -enemy.radius,
            -enemy.radius-12,
            enemy.radius*2,
            5
        );


        ctx.fillStyle =
            "#4cff55";


        ctx.fillRect(

            -enemy.radius,
            -enemy.radius-12,

            enemy.radius*2*
            Math.max(
                0,
                enemy.hp/
                enemy.maxHP
            ),

            5

        );


        /* BOSS AURASI */

        if(
            enemy.type ===
            "boss"
        ){

            ctx.fillStyle =
                "#63000a";


            ctx.beginPath();


            ctx.arc(
                0,
                0,
                enemy.radius+10,
                0,
                Math.PI*2
            );


            ctx.fill();

        }


        /* GÖVDE */

        ctx.fillStyle =
            enemy.color;


        ctx.beginPath();


        ctx.arc(
            0,
            0,
            enemy.radius,
            0,
            Math.PI*2
        );


        ctx.fill();


        /* GÖZLER */

        if(
            enemy.type !==
            "boss"
        ){

            ctx.fillStyle =
                "#111";


            ctx.beginPath();


            ctx.arc(
                -6,
                -3,
                3,
                0,
                Math.PI*2
            );


            ctx.arc(
                6,
                -3,
                3,
                0,
                Math.PI*2
            );


            ctx.fill();

        }


        /* BOSS GÖZ */

        if(
            enemy.type ===
            "boss"
        ){

            ctx.fillStyle =
                "#ffff00";


            ctx.beginPath();


            ctx.arc(
                0,
                0,
                13,
                0,
                Math.PI*2
            );


            ctx.fill();

        }


        ctx.restore();

    }


    /* =========================
       TANK
    ========================= */

    if(player){

        ctx.save();


        ctx.translate(
            player.x,
            player.y
        );


        ctx.rotate(
            player.angle
        );


        /* PALETLER */

        ctx.fillStyle =
            "#1c241e";


        ctx.fillRect(
            -29,
            -25,
            9,
            50
        );


        ctx.fillRect(
            20,
            -25,
            9,
            50
        );


        /* GÖVDE */

        const tank =
            tanks[selectedTank];


        ctx.fillStyle =
            selectedTank === "plasma"
            ? "#22c1c3"
            : selectedTank === "titan"
            ? "#777777"
            : selectedTank === "heavy"
            ? "#665544"
            : "#4caf50";


        ctx.fillRect(
            -23,
            -19,
            46,
            38
        );


        /* TARET */

        ctx.fillStyle =
            "#78df70";


        ctx.beginPath();


        ctx.arc(
            0,
            0,
            16,
            0,
            Math.PI*2
        );


        ctx.fill();


        /* TOP */

        ctx.fillStyle =
            "#252525";


        ctx.fillRect(
            5,
            -5,
            40,
            10
        );


        ctx.restore();

    }


    /* PARTICLES */

    for(
        const particle
        of particles
    ){

        ctx.globalAlpha =
            particle.life/35;


        ctx.fillStyle =
            particle.color;


        ctx.fillRect(
            particle.x,
            particle.y,
            5,
            5
        );

    }


    ctx.globalAlpha = 1;

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

    if(!running)
        return;


    update();

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    running = false;


    saveData.coins =
        player.coins;


    saveData.level =
        Math.max(
            saveData.level,
            player.level
        );


    saveGame();


    document
        .getElementById(
            "finalWave"
        )
        .textContent =
        "🌊 Wave: " +
        wave;


    document
        .getElementById(
            "finalLevel"
        )
        .textContent =
        "⭐ Level: " +
        player.level;


    document
        .getElementById(
            "finalCoins"
        )
        .textContent =
        "🪙 Coin: " +
        player.coins;


    document
        .getElementById(
            "gameOver"
        )
        .style.display =
        "flex";

}


/* =====================================================
   SİLAH SATIN ALMA
===================================================== */

function buyWeapon(id){

    const weapon =
        weapons[id];


    if(!weapon)
        return;


    if(
        ownedWeapons
        .includes(id)
    ){

        selectWeapon(id);

        return;

    }


    if(
        saveData.coins <
        weapon.price
    ){

        alert(
            "Yeterli coin yok!"
        );

        return;

    }


    saveData.coins -=
        weapon.price;


    ownedWeapons.push(id);


    saveData.ownedWeapons =
        ownedWeapons;


    saveGame();


    selectWeapon(id);

    updateShop();

    updateMenuCurrency();


    alert(
        weapon.name +
        " satın alındı!"
    );

}


/* =====================================================
   SİLAH MAĞAZASI
===================================================== */

function renderWeaponShop(){

    const container =
        document.getElementById(
            "weaponShop"
        );


    container.innerHTML = "";


    for(
        const id in weapons
    ){

        const weapon =
            weapons[id];


        const owned =
            ownedWeapons
            .includes(id);


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "shopItem";


        div.innerHTML = `

            <div>

                <b>
                    ${weapon.icon}
                    ${weapon.name}
                </b>

                <br>

                Hasar:
                ${weapon.damage}

                <br>

                Ateş hızı:
                ${weapon.fireDelay}ms

            </div>

            <button
                onclick="
                    buyWeapon('${id}')
                "
            >

                ${
                    owned
                    ?
                    "KUŞAN"
                    :
                    "🪙 " +
                    weapon.price
                }

            </button>

        `;


        container.appendChild(
            div
        );

    }

}


/* =====================================================
   SHOP
===================================================== */

let damagePrice = 100;

let healthPrice = 150;

let firePrice = 200;


function openShop(){

    hideAllScreens();


    document
        .getElementById(
            "shop"
        )
        .style.display =
        "flex";


    updateShop();

}


function closeShop(){

    document
        .getElementById(
            "shop"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "menu"
        )
        .style.display =
        "flex";

}


function buyDamage(){

    if(
        saveData.coins <
        damagePrice
    ){

        alert(
            "Yeterli coin yok!"
        );

        return;

    }


    saveData.coins -=
        damagePrice;


    saveData.damageUpgrade++;


    damagePrice =
        Math.floor(
            damagePrice*1.5
        );


    saveGame();

    updateShop();

    updateMenuCurrency();

}


function buyHealth(){

    if(
        saveData.coins <
        healthPrice
    ){

        alert(
            "Yeterli coin yok!"
        );

        return;

    }


    saveData.coins -=
        healthPrice;


    saveData.healthUpgrade++;


    healthPrice =
        Math.floor(
            healthPrice*1.5
        );


    saveGame();

    updateShop();

    updateMenuCurrency();

}


function buyFireRate(){

    if(
        saveData.coins <
        firePrice
    ){

        alert(
            "Yeterli coin yok!"
        );

        return;

    }


    saveData.coins -=
        firePrice;


    saveData.fireUpgrade++;

        Math.floor(

}


function updateShop(){

    document
        .getElementById(
            "damageLevel"
        )
        .textContent =
        saveData.damageUpgrade;


    document
        .getElementById(
            "healthLevel"
        )
        .textContent =
        saveData.healthUpgrade;


    document
        .getElementById(
            "fireLevel"
        )
        .textContent =
        saveData.fireUpgrade;


    document
        .getElementById(
            "damagePrice"
        )
        .textContent =
        damagePrice;


    document
        .getElementById(
            "healthPrice"
        )
        .textContent =
        healthPrice;


    document
        .getElementById(
            "firePrice"
        )
        .textContent =
        firePrice;


    renderWeaponShop();

}


/* =====================================================
   MENÜ PARA
===================================================== */

        .getElementById(
            "menuCoins"
        )
        .textContent =
        saveData.coins;

            "menuGems"
        )

===================================================== */

        .getElementById(

        )
        .style.display =
        "none";


    document
        .getElementById(
            "tankScreen"
        )
        .classList
        .add(
            "hidden"
        );


    document
        .getElementById(
            "mapScreen"
        )
        .classList
        .add(
            "hidden"
        );


    document
        .getElementById(
            "shop"
        )
        .style.display =

            "gameOver"
        )
        .style.display =

        .getElementById(

        .style.display =

        )

updateMenuCurrency();
